name: Build and release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.x"

      - name: Publish self-contained x64 single-file build
        run: >
          dotnet publish RealmeBuds.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:Platform=x64
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:SatelliteResourceLanguages=en-US
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify single-file output
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem publish -Filter *.exe -File)
          if ($executables.Count -ne 1 -or $executables[0].Name -ne "RealmeBuds.exe") {
            throw "Expected exactly one RealmeBuds.exe in the publish output."
          }
          Get-ChildItem publish -File |
            Where-Object { $_.Name -ne "RealmeBuds.exe" } |
            Remove-Item -Force
          Get-ChildItem publish -Directory | Remove-Item -Recurse -Force

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath RealmeBuds-build-${{ github.run_number }}-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: RealmeBuds-build-${{ github.run_number }}-win-x64
          path: RealmeBuds-build-${{ github.run_number }}-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          generate_release_notes: true
          files: RealmeBuds-build-${{ github.run_number }}-win-x64.zip
