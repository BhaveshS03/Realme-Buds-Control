name: Build and release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.x"

      - name: Publish x64 build using Windows runtimes
        run: >
          dotnet publish RealmeBuds.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish
          -p:Platform=x64
          -p:WindowsAppSDKSelfContained=false
          -p:SatelliteResourceLanguages=en-US
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Keep only English resources
        shell: pwsh
        run: |
          Get-ChildItem publish -Directory |
            Where-Object {
              $_.Name -match '^[a-z]{2,3}[-_][A-Za-z0-9-]+$' -and
              $_.Name -notmatch '^en[-_]us$'
            } |
            Remove-Item -Recurse -Force

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath RealmeBuds-build-${{ github.run_number }}-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: RealmeBuds-build-${{ github.run_number }}-win-x64
          path: RealmeBuds-build-${{ github.run_number }}-win-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          generate_release_notes: true
          files: RealmeBuds-build-${{ github.run_number }}-win-x64.zip
